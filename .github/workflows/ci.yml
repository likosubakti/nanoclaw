name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Catches seams TypeScript cannot: a channel with no caller, a bridge
      # method with no UI, an event variant nobody renders.
      - name: Check wiring
        run: npm run check:wiring

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The icons are generated, not committed. Fail if the generator drifts
      # from what the build expects.
      - name: Verify icon generation is reproducible
        run: |
          npm run icons
          test -f resources/icons/512x512.png
          test -f resources/icons/icon.png

      - name: Smoke-test the app under a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libsecret-1-0
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            node scripts/smoke.mjs

      # Packaging is where a working checkout most often stops working, so it
      # runs on every push rather than only at release time.
      - name: Package
        run: npm run dist

      - name: Check the packaged app starts
        run: |
          chmod +x release/*.AppImage
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            ./release/*.AppImage --appimage-extract-and-run --no-sandbox
        env:
          GLM_STUDIO_SMOKE: '1'
