<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>GLM Studio</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141d2e"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect x="0" y="0" width="512" height="512" rx="110" ry="110"/>
    </clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="512" height="512" fill="url(#tile)"/>
    <g style="mix-blend-mode:screen" opacity="0.82">
      <circle cx="256" cy="187" r="120" fill="#38bdf8"/>
      <circle cx="316" cy="291" r="120" fill="#f97316"/>
      <circle cx="196" cy="291" r="120" fill="#a78bfa"/>
    </g>
  </g>
  <rect x="1.5" y="1.5" width="509" height="509" rx="108.5" ry="108.5"
        fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
</svg>
